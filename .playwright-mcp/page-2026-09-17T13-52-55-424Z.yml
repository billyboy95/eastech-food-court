      - heading "A campus kitchen with a name on the building" [level=1] [ref=f4e23]
      - paragraph [ref=f4e24]: Entity 03 of the EASTC Technocentric Varsity — on the same Maxwell Street grounds as Foundation and the Institute.
    - generic [ref=f4e26]:
      - generic [ref=f4e27]:
        - paragraph [ref=f4e28]: "The Food Court feeds the campus and hosts the days that need more than a classroom: Foundation programmes, SETA cohorts, workshop groups, graduation teas, and neighbour gatherings."
        - paragraph [ref=f4e29]: The lounge, glass pavilion, and courtyard are part of campus life — study tables upstairs, plates downstairs, garden seats when the weather holds. Red window frames on Maxwell Street mark the kitchen. The round Food Court badge sits on the timber fascia above the plants.
        - paragraph [ref=f4e30]: "EASTC Holdings lists four education entities plus Foundation NPC and The Food Court on one campus. This site is the public door for the pavilion: where it is, when it is open, and how to hire it. Daily meal ordering is a different site."
      - img "The Food Court exterior with signage and planter boxes" [ref=f4e31]
