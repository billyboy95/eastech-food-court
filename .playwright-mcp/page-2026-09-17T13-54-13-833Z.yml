        - paragraph [ref=f13e36]: The Food Court is the third entity on the EASTC Technocentric Varsity campus, beside EASTC Foundation NPC and EASTECH Institute. It feeds students, staff, artisans, and neighbours — and it hosts the days that need a room, a pot, and a garden.
        - paragraph [ref=f13e37]: Ground floor is the kitchen and the Maxwell Street windows. Upstairs is the wood-ceiling lounge and glass pavilion. Outside, the courtyard runs to the blue EASTC hall. Study tables when class is on. Buffet trays when Foundation, SETA, or graduation days land.
